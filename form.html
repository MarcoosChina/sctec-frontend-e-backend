<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <section>
        <h1>Candidatação</h1>
        <p>Preencha o formulário abaixo para se candidatar a uma vaga de emprego.</p>
        <form action = "" id="form">
            <label for="nome">Nome completo:</label>
            <input type="text" id = "nome" name="nome" required><br>
            <label for="email">E-mail:</label>
            <input type="email" id = "email" name="email" required><br>
            <label for="idade">Idade:</label>
            <input type="number" id = "idade" name="idade" required><br>
            <label for="telefone">Telefone:</label>
            <input type="telefone" id = "telefone" name="telefone" required><br><br>
            <label for="materia">Matéria escolhida:</label>
            <select name="materia" id="materia" required>
                <option value="matematica">Matemática</option>
                <option value="portugues">Português</option>
                <option value="historia">História</option>
                <option value="geografia">Geografia</option>
                <option value="artes">Artes</option>
            </select>
            <br><br>
            <label for="escolaridade">Nivel de Escolaridade:</label>
            <select name="escolaridade" id="escolaridade" required>
                <option value="cursando ensino superior">Cursando ensino superior</option>
                <option value="ensino superior completo">Ensino Superior completo</option>
                <option value="cursando mestrado">Cursando mestrado</option>
                <option value="mestrado completo">Mestrado completo</option>
                <option value="cursando doutorado"> Cursando doutorado</option>
                <option value="doutorado completo">Doutorado completo</option>
            </select>
            <br><br>
            <label for="descricao">Descrição sobre você:</label>
            <textarea name="descricao" id="descricao" cols="30" rows="5" required></textarea><br><br>
            <input type="submit" value="Enviar candidatura">
        </form>
    </section>
    
</body>
</html>
